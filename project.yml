include:
  - i18n/generated/project.yml
name: solstone-swift
options:
  bundleIdPrefix: app.solstone
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

schemes:
  SolstoneWatch:
    build:
      targets:
        SolstoneWatch: all
        SolstoneWatchTests: [test]
    test:
      targets:
        - SolstoneWatchTests

settings:
  base:
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 7QCG8V4M6H
    MARKETING_VERSION: "2.0.14"
    CURRENT_PROJECT_VERSION: 166
    TARGETED_DEVICE_FAMILY: "1,2"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    # The store age check (Sources/AgeSignal). NO for every build a published binary is cut
    # from: the check is not compiled in and no age API is called. A proof build passes
    # AGE_SIGNAL=YES to make. Turning it on for publication is this one line, together with
    # the com.apple.developer.declared-age-range entitlement on the app target.
    SOLSTONE_AGE_SIGNAL: NO
    SOLSTONE_AGE_SIGNAL_SWIFT_FLAG_YES: -DSOLSTONE_AGE_SIGNAL
    SOLSTONE_AGE_SIGNAL_SWIFT_FLAG_NO: ""
    OTHER_SWIFT_FLAGS: $(inherited) $(SOLSTONE_AGE_SIGNAL_SWIFT_FLAG_$(SOLSTONE_AGE_SIGNAL))

packages:
  SwiftCrypto:
    url: https://github.com/apple/swift-crypto.git
    from: "3.0.0"
  spl-swift:
    url: https://github.com/solpbc/spl-swift.git
    exactVersion: "0.10.3"

targets:
  solstone-swift:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Localization/AppShortcuts.xcstrings
        buildPhase: resources
      - path: Localization/AppStrings.generated.swift
      - path: Localization/Localizable.xcstrings
        buildPhase: resources
      - path: Localization/Metadata/solstone-swift/InfoPlist.xcstrings
        buildPhase: resources
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
      - path: vendor/browser-contract
        type: folder
        buildPhase: resources
    configFiles:
      Debug: config/BuildMetadata.generated.xcconfig
      Release: config/BuildMetadata.generated.xcconfig
    entitlements:
      path: Sources/solstone-swift.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.solstone.swift
        aps-environment: development
        com.apple.developer.associated-domains:
          - applinks:go.solstone.app
        com.apple.developer.device-information.user-assigned-device-name: true
        keychain-access-groups:
          - $(AppIdentifierPrefix)app.solstone.swift
          - $(AppIdentifierPrefix)app.solstone.push
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_VERSION: "6.0"
        PRODUCT_BUNDLE_IDENTIFIER: app.solstone.swift
    info:
      path: Sources/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        solstoneTeamPrefix: "$(AppIdentifierPrefix)"
        # The brand face is registered HERE, and only here. It was previously declared
        # as an INFOPLIST_KEY_UIAppFonts build setting, but INFOPLIST_KEY_* settings are
        # only merged into a *generated* Info.plist and this target ships an explicit
        # one, so that declaration was silently dropped. Comfortaa-Bold shipped inside the .app
        # but was never registered, so every `.font(.custom("Comfortaa-Bold", ...))` in
        # the app — the journal mark's own words included — fell back to the system
        # face. Verified against the built Info.plist, which had no UIAppFonts key.
        UIAppFonts:
          - Comfortaa-Bold.ttf
        CFBundleURLTypes:
          - CFBundleURLName: app.solstone.swift
            CFBundleURLSchemes:
              - solstone
        UILaunchStoryboardName: LaunchScreen
        UIBackgroundModes:
          - audio
          - fetch
          - location
          - remote-notification
        BGTaskSchedulerPermittedIdentifiers:
          - app.solstone.swift.finish-syncing.*
          - app.solstone.swift.calendar-refresh
        solstoneSourceCommit: "$(SOLSTONE_SOURCE_COMMIT)"
        solstoneBuildConfiguration: "$(SOLSTONE_BUILD_CONFIGURATION)"
        solstoneSPLSwiftIdentity: "$(SOLSTONE_SPL_SWIFT_IDENTITY)"
        solstoneSPLSwiftVersion: "$(SOLSTONE_SPL_SWIFT_VERSION)"
        solstoneSPLSwiftRevision: "$(SOLSTONE_SPL_SWIFT_REVISION)"
    dependencies:
      - package: spl-swift
        product: SPLTunnel
      - package: spl-swift
        product: SPLMark
      - package: SwiftCrypto
        product: Crypto
      - target: SolstoneNotificationService
        embed: true
      - target: SolstoneSafariExtension
        embed: true
      - target: SolstoneShareExtension
        embed: true
      - target: SolstoneBroadcastExtension
        embed: true
      - target: SolstoneLiveActivityWidget
        embed: true
      - target: SolstoneWatch
        embed: true
  SolstoneSafariExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Localization/AppStrings.generated.swift
      - path: Localization/Localizable.xcstrings
        buildPhase: resources
      - path: Localization/Metadata/SolstoneSafariExtension/InfoPlist.xcstrings
        buildPhase: resources
      - path: SolstoneSafariExtension
      - path: Sources/SafariBrowser
        excludes:
          - SafariBrowserDelivery.swift
      - path: Sources/Services/AppGroupContainer.swift
      - path: Sources/AgeSignal/AgeSignalGate.swift
      - path: Sources/SourceIntake/SourceIntakeStore.swift
      - path: vendor/browser-contract
        type: folder
        buildPhase: resources
    postBuildScripts:
      # Safari loads the extension from the appex's resource root.
      - name: Bundle the vendored Safari extension
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          /usr/bin/rsync -a "$SRCROOT/vendor/safari-extension/" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/"
    entitlements:
      path: SolstoneSafariExtension/SolstoneSafariExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.solstone.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.solstone.swift.safari
        PRODUCT_NAME: SolstoneSafariExtension
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: SolstoneSafariExtension/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: SafariWebExtensionHandler
  SolstoneNotificationService:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Localization/AppStrings.generated.swift
      - path: Localization/Localizable.xcstrings
        buildPhase: resources
      - path: Localization/Metadata/SolstoneNotificationService/InfoPlist.xcstrings
        buildPhase: resources
      - SolstoneNotificationService
      - Sources/Push/PushEnvelope.swift
      - Sources/Push/PushKeyStore.swift
      - Sources/Push/PushMessages.swift
      - path: Sources/Push/PushMessages.xcstrings
        buildPhase: resources
      - Sources/Push/PushCatalogContract.swift
      - Sources/Push/PushPresentation.swift
    entitlements:
      path: SolstoneNotificationService/SolstoneNotificationService.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)app.solstone.push
    dependencies:
      - package: SwiftCrypto
        product: Crypto
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.solstone.swift.service
        CODE_SIGN_ENTITLEMENTS: SolstoneNotificationService/SolstoneNotificationService.entitlements
        DEVELOPMENT_TEAM: 7QCG8V4M6H
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_VERSION: "6.0"
    info:
      path: SolstoneNotificationService/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        solstoneTeamPrefix: "$(AppIdentifierPrefix)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
  SolstoneShareExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Localization/AppStrings.generated.swift
      - path: Localization/Localizable.xcstrings
        buildPhase: resources
      - path: Localization/Metadata/SolstoneShareExtension/InfoPlist.xcstrings
        buildPhase: resources
      - SolstoneShareExtension
      - Sources/Background/MaintenanceCooperator.swift
      - Sources/ShareImport/ShareImportStore.swift
      - Sources/ShareImport/ShareImportOrigin.swift
      - Sources/ShareImport/ShareImportPayloadIO.swift
      - Sources/ShareImport/ShareImportFileLanding.swift
      - Sources/ShareImport/ShareExtensionItemProvider.swift
      - Sources/Instrumentation/DrainSignpost.swift
      - Sources/OnThisPhoneModel.swift
      - Sources/Services/AppGroupContainer.swift
      - Sources/SourceIntake/SourceIntakeStore.swift
      - Sources/Observer/ObserverAudioTransferSource.swift
      - Sources/Observer/ObserverServerURL.swift
      - Sources/SourceVocabulary.swift
      - Sources/Design/Colors.swift
      - Sources/ShareImport/ShareImportCoordinator.swift
    entitlements:
      path: SolstoneShareExtension/SolstoneShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.solstone.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.solstone.swift.share
        CODE_SIGN_ENTITLEMENTS: SolstoneShareExtension/SolstoneShareExtension.entitlements
        DEVELOPMENT_TEAM: 7QCG8V4M6H
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_VERSION: "6.0"
    info:
      path: SolstoneShareExtension/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule: SUBQUERY(extensionItems, $item, SUBQUERY($item.attachments, $att, SUBQUERY($att.registeredTypeIdentifiers, $uti, $uti UTI-CONFORMS-TO "public.data" AND NOT ($uti UTI-CONFORMS-TO "public.url")).@count > 0).@count == $item.attachments.@count).@count == extensionItems.@count
  SolstoneBroadcastExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Localization/AppStrings.generated.swift
      - path: Localization/Localizable.xcstrings
        buildPhase: resources
      - path: Localization/Metadata/SolstoneBroadcastExtension/InfoPlist.xcstrings
        buildPhase: resources
      - path: SolstoneBroadcastExtension
      - path: Sources/Services/AppGroupContainer.swift
      - path: Sources/AgeSignal/AgeSignalGate.swift
      - path: Sources/MobileSegment/MobileSegmentModels.swift
      - path: Sources/Observer/ObserverMode.swift
      - path: Sources/MobileSegment/MobileSegmentScreencastShared.swift
      - path: Sources/MobileSegment/MobileSegmentScreencastSession.swift
      - path: Sources/MobileSegment/ScreencastBroadcastAudioWriter.swift
      - path: Sources/MobileSegment/ScreencastMicProbe.swift
      - path: Sources/JournalEvents/ISOBMFFBoxWalk.swift
      - path: Sources/JournalEvents/JournalEventStore.swift
    entitlements:
      path: SolstoneBroadcastExtension/SolstoneBroadcastExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.solstone.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.solstone.swift.broadcast
        PRODUCT_NAME: solstone-broadcast
        CODE_SIGN_ENTITLEMENTS: SolstoneBroadcastExtension/SolstoneBroadcastExtension.entitlements
        DEVELOPMENT_TEAM: 7QCG8V4M6H
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_VERSION: "6.0"
    info:
      path: SolstoneBroadcastExtension/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
  SolstoneLiveActivityWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Localization/AppStrings.generated.swift
      - path: Localization/Localizable.xcstrings
        buildPhase: resources
      - path: Localization/Metadata/SolstoneLiveActivityWidget/InfoPlist.xcstrings
        buildPhase: resources
      - SolstoneLiveActivityWidget
      - Sources/Observer/ObserverMode.swift
      - Sources/Observer/ObserverClock.swift
      - Sources/Observer/ObserverLiveActivity.swift
      - Sources/Design/Colors.swift
      - Sources/Services/AppGroupMirror.swift
      - Sources/Services/AppGroupContainer.swift
      - Sources/SourceModels.swift
      - Sources/SourceVocabulary.swift
      - Sources/Widgets/ObserverStatusPresentation.swift
      - Sources/AppIntents/ObserverWidgetConfigurationIntent.swift
      - Sources/AppIntents/ObserverCaptureIntent.swift
    entitlements:
      path: SolstoneLiveActivityWidget/SolstoneLiveActivityWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.solstone.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.solstone.swift.liveactivity
        CODE_SIGN_ENTITLEMENTS: SolstoneLiveActivityWidget/SolstoneLiveActivityWidget.entitlements
        DEVELOPMENT_TEAM: 7QCG8V4M6H
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_VERSION: "6.0"
        OTHER_SWIFT_FLAGS: -DSOLSTONE_LIVE_ACTIVITY_WIDGET
    info:
      path: SolstoneLiveActivityWidget/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  SolstoneWatch:
    type: application
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - path: Localization/AppStrings.generated.swift
      - path: Localization/Localizable.xcstrings
        buildPhase: resources
      - path: Localization/Metadata/SolstoneWatch/InfoPlist.xcstrings
        buildPhase: resources
      - Watch/Sources
      - Watch/PrivacyInfo.xcprivacy
      - Watch/Assets.xcassets
      - Sources/AppVersion.swift
      - path: Sources/SunArc
      - path: Sources/WatchCapture
        excludes:
          - WatchSegmentDrain.swift
          - WatchRelayReceiver.swift
          - WatchSegmentLedger.swift
          - WatchPhoneSessionHistoryStore.swift
          - WatchPipelineReducer.swift
          - PhoneWatchSourceStateMapping.swift
          - WatchSourceFacts.swift
          - WatchSteadyVerdictReducer.swift
          - WatchSourceDetailPresentation.swift
          - WatchStoppedItselfClock.swift
      - path: Sources/WatchConnectivity
        excludes:
          - WatchLink.swift
      - Sources/Observer/ObserverClock.swift
      - Sources/Observer/ObserverError.swift
      - Sources/Services/AppGroupContainer.swift
      - Sources/SourceVocabulary.swift
      - Sources/SourceModels.swift
    entitlements:
      path: Watch/SolstoneWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.solstone.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.solstone.swift.watch
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_VERSION: "6.0"
    info:
      path: Watch/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: YES
        WKCompanionAppBundleIdentifier: app.solstone.swift
        UIBackgroundModes:
          - audio
          - location
    dependencies:
      - target: SolstoneWatchComplication
        embed: true
  SolstoneWatchComplication:
    type: app-extension
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - path: Localization/AppStrings.generated.swift
      - path: Localization/Localizable.xcstrings
        buildPhase: resources
      - path: Localization/Metadata/SolstoneWatchComplication/InfoPlist.xcstrings
        buildPhase: resources
      - SolstoneWatchComplication
      - Sources/SourceVocabulary.swift
      - Sources/WatchCapture/WatchFacePresentation.swift
      - Sources/WatchCapture/WatchCaptureModels.swift
      - Sources/WatchCapture/WatchComplicationSnapshot.swift
      - Sources/WatchCapture/WatchComplicationSnapshotLoader.swift
      - Sources/Services/AppGroupContainer.swift
      - Sources/Observer/ObserverError.swift
    entitlements:
      path: SolstoneWatchComplication/SolstoneWatchComplication.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.solstone.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.solstone.swift.watch.widget
        CODE_SIGN_ENTITLEMENTS: SolstoneWatchComplication/SolstoneWatchComplication.entitlements
        DEVELOPMENT_TEAM: 7QCG8V4M6H
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_VERSION: "6.0"
    info:
      path: SolstoneWatchComplication/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  SolstoneWatchTests:
    type: bundle.unit-test
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - path: Localization/AppStrings.generated.swift
      - path: Localization/Localizable.xcstrings
        buildPhase: resources
      - WatchTests
      - Tests/SunArcEngineTests.swift
      - Tests/WatchSunArcDrawingTests.swift
      - Tests/WatchElapsedDurationTests.swift
      - Tests/WatchHomeHeroTests.swift
      - Tests/WatchHomeControlStyleTests.swift
      - Tests/WatchComplicationLiteralTests.swift
      - Tests/AboutBlockTests.swift
      - SolstoneWatchComplication/ComplicationViews.swift
      - SolstoneWatchComplication/WatchComplicationPalette.swift
      - Sources/SourceVocabulary.swift
      - path: Sources/SunArc
      - path: Sources/WatchCapture
        excludes:
          - WatchSegmentDrain.swift
          - WatchRelayReceiver.swift
          - WatchSegmentLedger.swift
          - WatchPhoneSessionHistoryStore.swift
          - WatchPipelineReducer.swift
          - PhoneWatchSourceStateMapping.swift
          - WatchSourceFacts.swift
          - WatchSteadyVerdictReducer.swift
          - WatchSourceDetailPresentation.swift
      - path: Sources/WatchConnectivity
        excludes:
          - WatchLink.swift
      - Sources/Observer/ObserverClock.swift
      - Sources/Services/AppGroupContainer.swift
      - Sources/SourceModels.swift
      - Watch/Sources/WatchCaptureModel.swift
      - Watch/Sources/LiveWatchLocationProvider.swift
      - Watch/Sources/WatchSessionModel.swift
      - Sources/Observer/ObserverError.swift
      - path: SolstoneWatchComplication/Assets.xcassets
        buildPhase: resources
      - path: Tests/Fixtures/solstone-core-about
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.solstone.swift.watch.tests
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_VERSION: "6.0"
  solstone-swiftTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes:
          - Fixtures/LinkedDeviceIngest
      - path: Localization/AppStrings.generated.swift
      - path: Localization/Localizable.xcstrings
        buildPhase: resources
      - path: Tests/Fixtures/LinkedDeviceIngest
        type: folder
        buildPhase: resources
    resources:
      - Tests/Fixtures/ShareImportBodies
      - Tests/Fixtures/AudioRecovery
      - Tests/Fixtures/IntegrationGate
      - Tests/Fixtures/WatchCaptureStoragePreActor
      - Tests/Fixtures/PushEnvelope
      - Tests/Fixtures/solstone-core-about
      - Tests/Fixtures/DeviceMigration/v1.schema.json
      - Tests/Fixtures/DeviceMigration/v1.vectors.json
      - Tests/Fixtures/DeviceMigration/issued-crypto-memory-fixture-261006.json
    dependencies:
      - target: solstone-swift
      - package: spl-swift
        product: SPLTunnel
      - package: spl-swift
        product: SPLMark
      - package: SwiftCrypto
        product: Crypto
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.solstone.swift.tests
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_VERSION: "6.0"
  solstone-swiftUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: solstone-swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.solstone.swift.uitests
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        TEST_TARGET_NAME: solstone-swift
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_VERSION: "6.0"
