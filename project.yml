name: solstone-swift
options:
  bundleIdPrefix: app.solstone
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

schemes:
  SolstoneWatch:
    build:
      targets:
        SolstoneWatch: all
        SolstoneWatchTests: [test]
    test:
      targets:
        - SolstoneWatchTests

settings:
  base:
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 7QCG8V4M6H
    MARKETING_VERSION: "0.1.2"
    CURRENT_PROJECT_VERSION: 68
    TARGETED_DEVICE_FAMILY: "1,2"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES

packages:
  SwiftCrypto:
    url: https://github.com/apple/swift-crypto.git
    from: "3.0.0"
  spl-swift:
    url: https://github.com/solpbc/spl-swift.git
    exactVersion: "0.3.2"
  Opus:
    url: https://github.com/alta/swift-opus.git
    from: "0.0.2"

targets:
  solstone-swift:
    type: application
    platform: iOS
    sources:
      - path: Sources
    configFiles:
      Debug: config/BuildMetadata.generated.xcconfig
      Release: config/BuildMetadata.generated.xcconfig
    entitlements:
      path: Sources/solstone-swift.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.solstone.swift
        aps-environment: development
        com.apple.developer.associated-domains:
          - applinks:go.solstone.app
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: solstone
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "the solstone app takes in the audio from the meetings and voice memos you start. what you share stays on this device until you connect a journal for it to land in."
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "you can connect the solstone app to wearable audio devices like the Omi pendant over Bluetooth. what you share stays on this device until you connect a journal for it to land in."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "the solstone app takes in where you are, as part of what you share with it. what you share stays on this device until you connect a journal for it to land in. you choose how much, and you can change that any time."
        INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: "the solstone app takes in where you are, as part of what you share with it, including in the background. what you share stays on this device until you connect a journal for it to land in. you choose how much, and you can change that any time."
        INFOPLIST_KEY_NSCameraUsageDescription: "used to scan your journal's pairing code"
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_VERSION: "6.0"
        INFOPLIST_KEY_UIAppFonts: "[Comfortaa-Bold.ttf]"
        PRODUCT_BUNDLE_IDENTIFIER: app.solstone.swift
    info:
      path: Sources/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: app.solstone.swift
            CFBundleURLSchemes:
              - solstone
        UILaunchScreen:
          UIImageName: SolWordmark
          UIColorName: systemBackground
          UIImageRespectsSafeAreaInsets: true
        UIBackgroundModes:
          - audio
          - fetch
          - location
          - remote-notification
          - bluetooth-central
        BGTaskSchedulerPermittedIdentifiers:
          - app.solstone.swift.finish-syncing.*
        solstoneSourceCommit: "$(SOLSTONE_SOURCE_COMMIT)"
        solstoneBuildConfiguration: "$(SOLSTONE_BUILD_CONFIGURATION)"
        solstoneSPLSwiftIdentity: "$(SOLSTONE_SPL_SWIFT_IDENTITY)"
        solstoneSPLSwiftVersion: "$(SOLSTONE_SPL_SWIFT_VERSION)"
        solstoneSPLSwiftRevision: "$(SOLSTONE_SPL_SWIFT_REVISION)"
    dependencies:
      - package: spl-swift
        product: SPLTunnel
      - package: SwiftCrypto
        product: Crypto
      - target: SolstoneNotificationContent
        embed: true
      - target: SolstoneShareExtension
        embed: true
      - target: SolstoneBroadcastExtension
        embed: true
      - target: SolstoneLiveActivityWidget
        embed: true
      - target: SolstoneWatch
        embed: true
      - package: Opus
        product: Opus
  SolstoneNotificationContent:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - SolstoneNotificationContent
      - Sources/Design/Colors.swift
    entitlements:
      path: SolstoneNotificationContent/SolstoneNotificationContent.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.solstone.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.solstone.swift.content
        INFOPLIST_KEY_CFBundleDisplayName: SolstoneNotificationContent
        CODE_SIGN_ENTITLEMENTS: SolstoneNotificationContent/SolstoneNotificationContent.entitlements
        DEVELOPMENT_TEAM: 7QCG8V4M6H
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_VERSION: "6.0"
    info:
      path: SolstoneNotificationContent/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.content-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationViewController
          NSExtensionAttributes:
            # No categories currently use this no-op shell; target removal is an out-of-scope follow-up.
            UNNotificationExtensionCategory: []
            UNNotificationExtensionInitialContentSizeRatio: 1.0
            UNNotificationExtensionDefaultContentHidden: false
  SolstoneShareExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - SolstoneShareExtension
      - Sources/Background/MaintenanceCooperator.swift
      - Sources/ShareImport/ShareImportStore.swift
      - Sources/ShareImport/ShareImportPayloadIO.swift
      - Sources/ShareImport/ShareImportFileLanding.swift
      - Sources/ShareImport/ShareExtensionItemProvider.swift
      - Sources/Instrumentation/DrainSignpost.swift
      - Sources/OnThisPhoneModel.swift
      - Sources/Services/AppGroupContainer.swift
      - Sources/Observer/ObserverAudioTransferSource.swift
      - Sources/Observer/ObserverServerURL.swift
      - Sources/SourceVocabulary.swift
      - Sources/Design/Colors.swift
      - Sources/ShareImport/ShareImportCoordinator.swift
    entitlements:
      path: SolstoneShareExtension/SolstoneShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.solstone.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.solstone.swift.share
        INFOPLIST_KEY_CFBundleDisplayName: solstone
        CODE_SIGN_ENTITLEMENTS: SolstoneShareExtension/SolstoneShareExtension.entitlements
        DEVELOPMENT_TEAM: 7QCG8V4M6H
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_VERSION: "6.0"
    info:
      path: SolstoneShareExtension/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule: SUBQUERY(extensionItems, $item, SUBQUERY($item.attachments, $att, (ANY $att.registeredTypeIdentifiers UTI-CONFORMS-TO "com.adobe.pdf" OR ANY $att.registeredTypeIdentifiers UTI-CONFORMS-TO "public.audio" OR ANY $att.registeredTypeIdentifiers UTI-CONFORMS-TO "public.image" OR ANY $att.registeredTypeIdentifiers UTI-CONFORMS-TO "public.plain-text" OR ANY $att.registeredTypeIdentifiers == "public.m4a-audio" OR ANY $att.registeredTypeIdentifiers == "public.jpg" OR ANY $att.registeredTypeIdentifiers == "public.webp")).@count == $item.attachments.@count).@count == extensionItems.@count
  SolstoneBroadcastExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: SolstoneBroadcastExtension
      - path: Sources/Services/AppGroupContainer.swift
      - path: Sources/MobileSegment/MobileSegmentModels.swift
      - path: Sources/Observer/ObserverMode.swift
      - path: Sources/MobileSegment/MobileSegmentScreencastShared.swift
    entitlements:
      path: SolstoneBroadcastExtension/SolstoneBroadcastExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.solstone.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.solstone.swift.broadcast
        PRODUCT_NAME: solstone-broadcast
        INFOPLIST_KEY_CFBundleDisplayName: screen
        CODE_SIGN_ENTITLEMENTS: SolstoneBroadcastExtension/SolstoneBroadcastExtension.entitlements
        DEVELOPMENT_TEAM: 7QCG8V4M6H
        MARKETING_VERSION: "0.1.2"
        CURRENT_PROJECT_VERSION: 68
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_VERSION: "6.0"
    info:
      path: SolstoneBroadcastExtension/Info.plist
      properties:
        CFBundleDisplayName: screen
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
  SolstoneLiveActivityWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - SolstoneLiveActivityWidget
      - Sources/Observer/ObserverMode.swift
      - Sources/Observer/ObserverClock.swift
      - Sources/Observer/ObserverLiveActivity.swift
      - Sources/Design/Colors.swift
      - Sources/Services/AppGroupMirror.swift
      - Sources/Services/AppGroupContainer.swift
      - Sources/SourceModels.swift
      - Sources/SourceVocabulary.swift
      - Sources/AppIntents/ObserverWidgetConfigurationIntent.swift
      - Sources/AppIntents/ObserverCaptureIntent.swift
    entitlements:
      path: SolstoneLiveActivityWidget/SolstoneLiveActivityWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.solstone.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.solstone.swift.liveactivity
        INFOPLIST_KEY_CFBundleDisplayName: SolstoneLiveActivityWidget
        CODE_SIGN_ENTITLEMENTS: SolstoneLiveActivityWidget/SolstoneLiveActivityWidget.entitlements
        DEVELOPMENT_TEAM: 7QCG8V4M6H
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_VERSION: "6.0"
        OTHER_SWIFT_FLAGS: -DSOLSTONE_LIVE_ACTIVITY_WIDGET
    info:
      path: SolstoneLiveActivityWidget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  SolstoneWatch:
    type: application
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - Watch/Sources
      - Watch/PrivacyInfo.xcprivacy
      - Watch/Assets.xcassets
      - path: Sources/WatchCapture
        excludes:
          - WatchSegmentDrain.swift
      - Sources/WatchConnectivity
      - Sources/Observer/ObserverClock.swift
      - Sources/Observer/ObserverError.swift
      - Sources/Services/AppGroupContainer.swift
      - Sources/SourceVocabulary.swift
      - Sources/SourceModels.swift
    entitlements:
      path: Watch/SolstoneWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.solstone.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.solstone.swift.watch
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: solstone
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_VERSION: "6.0"
    info:
      path: Watch/Info.plist
      properties:
        WKApplication: YES
        WKCompanionAppBundleIdentifier: app.solstone.swift
        UIBackgroundModes:
          - audio
          - location
        NSMicrophoneUsageDescription: "the solstone app takes in the audio from a moment you start on your watch. what you share stays on the watch until it can go to your iphone, and from there into your journal."
        NSLocationWhenInUseUsageDescription: "the solstone app takes in where you are, as part of what you share with it during a moment you start on your watch. what you share stays on the watch until it can go to your iphone, and from there into your journal."
    dependencies:
      - target: SolstoneWatchComplication
        embed: true
  SolstoneWatchComplication:
    type: app-extension
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - SolstoneWatchComplication
      - Sources/SourceVocabulary.swift
      - Sources/WatchCapture/WatchFacePresentation.swift
      - Sources/WatchCapture/WatchCaptureModels.swift
      - Sources/WatchCapture/WatchComplicationSnapshot.swift
      - Sources/WatchCapture/WatchComplicationSnapshotLoader.swift
      - Sources/Services/AppGroupContainer.swift
      - Sources/Observer/ObserverError.swift
    entitlements:
      path: SolstoneWatchComplication/SolstoneWatchComplication.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.solstone.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.solstone.swift.watch.widget
        INFOPLIST_KEY_CFBundleDisplayName: solstone
        CODE_SIGN_ENTITLEMENTS: SolstoneWatchComplication/SolstoneWatchComplication.entitlements
        DEVELOPMENT_TEAM: 7QCG8V4M6H
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_VERSION: "6.0"
    info:
      path: SolstoneWatchComplication/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  SolstoneWatchTests:
    type: bundle.unit-test
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - WatchTests
      - SolstoneWatchComplication/ComplicationViews.swift
      - SolstoneWatchComplication/WatchComplicationPalette.swift
      - Sources/SourceVocabulary.swift
      - path: Sources/WatchCapture
        excludes:
          - WatchSegmentDrain.swift
      - Sources/WatchConnectivity
      - Sources/Observer/ObserverClock.swift
      - Sources/Services/AppGroupContainer.swift
      - Sources/SourceModels.swift
      - Watch/Sources/WatchCaptureModel.swift
      - Watch/Sources/LiveWatchLocationProvider.swift
      - Watch/Sources/WatchSessionModel.swift
      - Sources/Observer/ObserverError.swift
      - path: SolstoneWatchComplication/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.solstone.swift.watch.tests
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_VERSION: "6.0"
  solstone-swiftTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    resources:
      - Tests/Fixtures/ShareImportBodies
      - Tests/Fixtures/IntegrationGate
      - Tests/Fixtures/WatchCaptureStoragePreActor
    dependencies:
      - target: solstone-swift
      - package: spl-swift
        product: SPLTunnel
      - package: SwiftCrypto
        product: Crypto
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.solstone.swift.tests
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_VERSION: "6.0"
  solstone-swiftUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: solstone-swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.solstone.swift.uitests
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        TEST_TARGET_NAME: solstone-swift
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_VERSION: "6.0"
