name: solstone-swift
options:
  bundleIdPrefix: app.solstone
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 7QCG8V4M6H
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: 1
    TARGETED_DEVICE_FAMILY: "1,2"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES

packages:
  swift-nio-ssh:
    url: https://github.com/apple/swift-nio-ssh
    from: "0.12.0"
  swift-nio-transport-services:
    url: https://github.com/apple/swift-nio-transport-services
    from: "1.21.0"
  WebRTC:
    url: https://github.com/stasel/WebRTC
    from: "147.0.0"

targets:
  solstone-swift:
    type: application
    platform: iOS
    sources:
      - Sources
    entitlements:
      path: Sources/solstone-swift.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.solstone.swift
        aps-environment: development
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: solstone
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "solstone listens to meetings and voice memos you start, storing them in your private journal. Nothing is shared with sol pbc."
        INFOPLIST_KEY_UIBackgroundModes:
          - audio
          - fetch
          - remote-notification
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_VERSION: "6.0"
        INFOPLIST_KEY_UIAppFonts: "[Comfortaa-Bold.ttf]"
        PRODUCT_BUNDLE_IDENTIFIER: app.solstone.swift
    info:
      path: Sources/Info.plist
      properties:
        UILaunchScreen:
          UIImageName: SolWordmark
          UIColorName: systemBackground
          UIImageRespectsSafeAreaInsets: true
    dependencies:
      - target: SolstoneNotificationContent
        embed: true
      - target: SolstoneLiveActivityWidget
        embed: true
      - package: swift-nio-ssh
        product: NIOSSH
      - package: swift-nio-transport-services
        product: NIOTransportServices
      - package: WebRTC
        product: WebRTC
  SolstoneNotificationContent:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - SolstoneNotificationContent
      - Sources/Design/Colors.swift
    entitlements:
      path: SolstoneNotificationContent/SolstoneNotificationContent.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.solstone.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.solstone.swift.content
        INFOPLIST_KEY_CFBundleDisplayName: SolstoneNotificationContent
        CODE_SIGN_ENTITLEMENTS: SolstoneNotificationContent/SolstoneNotificationContent.entitlements
        DEVELOPMENT_TEAM: 7QCG8V4M6H
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_VERSION: "6.0"
    info:
      path: SolstoneNotificationContent/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.content-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationViewController
          NSExtensionAttributes:
            UNNotificationExtensionCategory:
              - SOLSTONE_DAILY_BRIEFING
              - SOLSTONE_COMMITMENT_NUDGE
              - SOLSTONE_PRE_MEETING_PREP
              - SOLSTONE_AGENT_ALERT
            UNNotificationExtensionInitialContentSizeRatio: 1.0
            UNNotificationExtensionDefaultContentHidden: false
  SolstoneLiveActivityWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - SolstoneLiveActivityWidget
      - Sources/Observer/ObserverMode.swift
      - Sources/Observer/ObserverLiveActivity.swift
      - Sources/Design/Colors.swift
    entitlements:
      path: SolstoneLiveActivityWidget/SolstoneLiveActivityWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.solstone.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.solstone.swift.liveactivity
        INFOPLIST_KEY_CFBundleDisplayName: SolstoneLiveActivityWidget
        CODE_SIGN_ENTITLEMENTS: SolstoneLiveActivityWidget/SolstoneLiveActivityWidget.entitlements
        DEVELOPMENT_TEAM: 7QCG8V4M6H
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_VERSION: "6.0"
    info:
      path: SolstoneLiveActivityWidget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  solstone-swiftTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: solstone-swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.solstone.swift.tests
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_VERSION: "6.0"
  solstone-swiftUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: solstone-swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.solstone.swift.uitests
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        TEST_TARGET_NAME: solstone-swift
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_VERSION: "6.0"
